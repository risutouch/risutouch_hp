<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ向けviewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>クイズプレイ</title>
  <style>
    /* リセット */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Arial, sans-serif; background: #f9f9f9; }
    
    /* ヘッダー（クイズ開始後に表示） */
    .header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #ccc;
      background: #fdfdfd;
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      margin-right: 10px;
      object-fit: cover;
    }
    .header h1 {
      font-size: 1.2em;
      text-align: center;
    }
    
    /* メインコンテナ */
    .main-container {
      width: 100%;
      max-width: 500px;
      margin: 10px auto;
      height: 90vh;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    /* 問題エリア */
    .question-area {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: center;
      flex: 0 0 auto;
    }
    .question-area p {
      font-size: 1.3em;
      margin-bottom: 8px;
    }
    .question-area img {
      max-width: 100%;
      max-height: 300px;
      display: block;
      margin: auto;
    }
    
    /* 解答エリア：初期は正方形固定 */
    .answer-area {
      position: relative;
      width: 100%;
      aspect-ratio: 1/1;
      padding: 10px;
    }
    /* 解答グリッド */
    .answer-grid {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 20px;
    }
    /* 各セル（枠）は常に正方形 */
    .grid-cell {
      position: relative;
      border: 2px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9em;
      aspect-ratio: 1/1;
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    /* テキストのみの場合はセルの高さを半分に */
    .grid-cell.text-only {
      aspect-ratio: 2/1;
    }
    /* 解答の画像表示 */
    .grid-cell img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .grid-cell.disabled {
      opacity: 0.6;
      pointer-events: none;
    }
    /* タイマーセル：タイマー部分は解答判定されないように */
    .grid-cell.countdown {
      pointer-events: none;
      transition: background 0.1s linear;
    }
    .grid-cell.countdown .time-display {
      position: absolute;
      font-size: 2em;
      color: #fff;
      text-shadow: 0 0 3px #000;
      z-index: 1;
    }
    
    /* タイマーエフェクトは effect1 のみ */
    .effect1 { }
    .effect1 .time-display { animation: none; }
    
    /* 正解表示用の円形オーバーレイ */
	.circle-overlay {
	  position: absolute;
	  top: 50%;
	  left: 50%;
	  width: 80px;      /* 以前は80px */
	  height: 80px;     /* 以前は80px */
	  border: 10px solid green;  /* 以前は5px */
	  border-radius: 50%;
	  transform: translate(-50%, -50%);
	  pointer-events: none;
	}
    
    /* トランジションオーバーレイ */
    #transitionOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      background-color: transparent;
    }
    
    /* 結果表示エリア */
    .result-area {
      text-align: center;
      padding: 10px;
      font-size: 1.2em;
      display: none;
    }
    /* 結果表示のフォントサイズを大きく */
    #resultMsg {
      font-size: 1.5em;
    }
    .result-area button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 1em;
      background: #0073e6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    /* カウントダウン用オーバーレイ（初期は非表示） */
    #startOverlay {
      position: fixed;
      top: 0; left: 0;
      right: 0; bottom: 0;
      background: #fff;
      color: #000;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 5em;
      z-index: 1000;
    }
    
    /* スタート画面 */
    #startScreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1500;
    }
    /* スタート画面内の各要素の余白 */
    #startScreen > * {
      margin: 10px 0;
    }
    /* 問題集情報を囲むボックス（角丸の四角） */
    #startHeader {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      width: 200px;
    }
    #startHeader img {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    #startHeader #startSetTitle {
      margin-top: 10px;
      font-size: 1.2em;
      text-align: center;
    }
    /* スタート画面のボタン共通デザイン */
    button.action-button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 1em;
      background: #0073e6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- カウントダウン用オーバーレイ（初期は非表示） -->
  <div id="startOverlay"></div>
  
  <!-- スタート画面 -->
  <div id="startScreen">
    <!-- 問題集情報（角丸の四角で囲む） -->
    <div id="startHeader">
      <img id="startSetIcon" src="" alt="セットアイコン">
      <div id="startSetTitle">セット名</div>
    </div>
    <!-- スタートボタン -->
    <button id="startButton" class="action-button">スタート</button>
    <!-- 戻るボタン -->
    <button id="backToIndex" class="action-button">戻る</button>
  </div>
  
  <!-- ヘッダー（クイズ開始後に表示） -->
  <div class="header">
    <img id="setIcon" src="" alt="セットアイコン">
    <h1 id="setTitle">セット名</h1>
  </div>
  
  <!-- メインコンテナ -->
  <div class="main-container" id="quizApp">
    <!-- 問題エリア -->
    <div class="question-area">
      <p id="questionText"></p>
      <img id="questionImg" src="" alt="問題画像" style="display:none;">
    </div>
    <!-- 解答エリア -->
    <div class="answer-area">
      <div class="answer-grid" id="answerGrid">
        <!-- 各セルはJavaScriptで生成 -->
      </div>
    </div>
  </div>
  
  <!-- 結果表示エリア -->
  <div class="result-area" id="resultArea">
    <p id="resultMsg"></p>
    <!-- 改行を追加 -->
    <button id="readExplanation" class="action-button">問題の解説を読む</button>
    <br>
    <button id="backBtn" class="action-button">はじめに戻る</button>
  </div>
  
  <!-- トランジションオーバーレイ -->
  <div id="transitionOverlay"></div>
  
  <script>
    (function(){
      // オーディオオブジェクトの生成（ファイルは sounds フォルダ内）
      const countdownSound = new Audio("sounds/countdown.mp3");
      const correctSound = new Audio("sounds/correct.mp3");
      const incorrectSound = new Audio("sounds/wrong.mp3");
      // すべての音量を0.3に設定
      countdownSound.volume = 0.3;
      correctSound.volume = 0.3;
      incorrectSound.volume = 0.3;
      
      // グローバル変数として問題集情報とsetIdを保持
      let quizSet = null;
      let setId = null;
      
      document.addEventListener("DOMContentLoaded", function(){
        // URLパラメータからsetId取得
        const params = new URLSearchParams(window.location.search);
        setId = params.get("setId");
        if(!setId){
          alert("問題集IDが指定されていません。");
          window.location.href = "index.html";
          return;
        }
        
        // クイズセット情報の取得
        fetch("db/quizSets.json")
          .then(response => {
            if(!response.ok) throw new Error("HTTPエラー " + response.status);
            return response.json();
          })
          .then(data => {
            quizSet = data.find(item => item.id === setId);
            if(quizSet){
              // ヘッダー用
              document.getElementById("setTitle").textContent = quizSet.name;
              document.getElementById("setIcon").src = quizSet.icon;
              // スタート画面用
              document.getElementById("startSetTitle").textContent = quizSet.name;
              document.getElementById("startSetIcon").src = quizSet.icon;
            } else {
              throw new Error("指定されたセット情報が見つかりません");
            }
          })
          .catch(err => {
            console.error("セット情報の読み込みエラー:", err);
            alert("セット情報の読み込みに失敗しました。");
            window.location.href = "index.html";
          });
        
        // 結果画面の「問題の解説を読む」ボタンのクリック処理
        document.getElementById("readExplanation").addEventListener("click", function(){
          if(quizSet && quizSet.url){
            window.open(quizSet.url, '_blank');
          } else {
            alert("解説のURLが設定されていません。");
          }
        });
          
        // スタートボタン押下時の処理（初期カウントダウン）
        document.getElementById("startButton").addEventListener("click", function(){
          document.getElementById("startScreen").style.display = "none";
          const overlay = document.getElementById("startOverlay");
          overlay.style.display = "flex";
          let count = 3;
          overlay.textContent = count;
          // ボタン押下と同時にすぐに音を再生
          countdownSound.play();
          const preInterval = setInterval(() => {
            count--;
            if(count === 0){
              clearInterval(preInterval);
              overlay.style.display = "none";
              startQuiz();
            } else {
              overlay.textContent = count;
              countdownSound.play();
            }
          }, 1000);
        });
        
        // スタート画面の戻るボタン押下時の処理
        document.getElementById("backToIndex").addEventListener("click", function(){
          window.location.href = "index.html";
        });
      });
      
      function startQuiz(){
        console.log("startQuiz() 開始");
        let questions = [];
        let remainingQuestions = [];
        let currentQ = null;
        let currentQIndex = 0; // 最大8問出題
        let correctCount = 0;
        let totalElapsed = 0;
        const timeLimit = 5.0; // 5秒タイマー
        let timer = null;
        let timeLeft = timeLimit;
        // タイマーエフェクトは effect1 のみ
        const timerEffects = ["effect1"];
        let currentTimerEffect = "";
        
        // DOM要素の取得
        const questionTextEl = document.getElementById("questionText");
        const questionImgEl = document.getElementById("questionImg");
        const answerGridEl = document.getElementById("answerGrid");
        const quizAppEl = document.getElementById("quizApp");
        const resultAreaEl = document.getElementById("resultArea");
        const resultMsgEl = document.getElementById("resultMsg");
        const backBtnEl = document.getElementById("backBtn");
        
        backBtnEl.addEventListener("click", () => { window.location.href = "index.html"; });
        
        // 問題データの取得
        fetch("db/" + setId + ".json")
          .then(response => {
            console.log("問題データレスポンス:", response.status);
            if(!response.ok) throw new Error("HTTPエラー " + response.status);
            return response.json();
          })
          .then(data => {
            console.log("問題データ取得:", data);
            if(!Array.isArray(data) || data.length === 0){
              alert("問題が登録されていません。");
              window.location.href = "index.html";
              return;
            }
            questions = data;
            remainingQuestions = shuffleArray(questions.slice());
            nextQuestion();
          })
          .catch(err => {
            console.error("問題データの読み込みエラー:", err);
            alert("問題データの読み込みに失敗しました。");
            window.location.href = "index.html";
          });
        
        // 正解セルに円形オーバーレイを追加する関数
        function addCircleOverlay(cell) {
          if(!cell.querySelector('.circle-overlay')){
            const circle = document.createElement("div");
            circle.className = "circle-overlay";
            cell.appendChild(circle);
          }
        }
        
        // 次の問題を出題する関数
        function nextQuestion(){
          if(currentQIndex >= 8){
            finishQuiz();
            return;
          }
          currentQIndex++;
          console.log("問題" + currentQIndex + "出題開始");
          if(remainingQuestions.length === 0){
            remainingQuestions = shuffleArray(questions.slice());
          }
          currentQ = remainingQuestions.shift();
          console.log("出題する問題:", currentQ);
          questionTextEl.textContent = currentQ.question || "";
          if(currentQ.questionImage && currentQ.questionImage.trim() !== ""){
            questionImgEl.src = currentQ.questionImage;
            questionImgEl.style.display = "block";
          } else {
            questionImgEl.style.display = "none";
          }
          populateAnswerGrid(currentQ);
          timeLeft = timeLimit;
          // 5秒タイマーは、問題開始後0.5秒後にスタート
          setTimeout(() => { startTimer(); }, 500);
        }
        
        // 解答グリッドの生成
        function populateAnswerGrid(qData){
          answerGridEl.innerHTML = "";
          let answerOptions = qData.answers.map((a, idx) => {
            return { text: a.text, image: a.image, isCorrect: idx === 0 };
          });
          answerOptions = shuffleArray(answerOptions);
          
          // すべてテキストのみの場合、グリッドの高さを半分に変更
          const answerArea = document.querySelector(".answer-area");
          const isTextOnly = answerOptions.every(option => !option.image || option.image.trim() === "");
          if(isTextOnly){
            answerArea.style.aspectRatio = "2/1";
          } else {
            answerArea.style.aspectRatio = "1/1";
          }
          
          const cdIndex = Math.floor(Math.random() * 4);
          console.log("カウントダウンセル位置:", cdIndex);
          for(let i = 0; i < 4; i++){
            const cellDiv = document.createElement("div");
            cellDiv.classList.add("grid-cell");
            if(isTextOnly){
              cellDiv.classList.add("text-only");
            }
            if(i === cdIndex){
              cellDiv.classList.add("countdown");
              currentTimerEffect = timerEffects[0];
              cellDiv.classList.add(currentTimerEffect);
              const timeSpan = document.createElement("div");
              timeSpan.classList.add("time-display");
              timeSpan.textContent = timeLimit.toFixed(1);
              cellDiv.appendChild(timeSpan);
            } else {
              let optIndex = (i < cdIndex) ? i : i - 1;
              const option = answerOptions[optIndex];
              if(option.image && option.image.trim() !== ""){
                const img = document.createElement("img");
                img.src = option.image;
                cellDiv.appendChild(img);
              }
              if(option.text && option.text.trim() !== ""){
                const span = document.createElement("span");
                span.textContent = option.text;
                cellDiv.appendChild(span);
              }
              cellDiv.dataset.correct = option.isCorrect;
              cellDiv.addEventListener("pointerup", function(){
                if(cellDiv.classList.contains("disabled")) return;
                clearInterval(timer);
                const elapsed = (timeLimit - timeLeft).toFixed(1);
                totalElapsed += parseFloat(elapsed);
                disableGridCells();
                if(cellDiv.dataset.correct === "true"){
                  cellDiv.style.backgroundColor = "#8f8";
                  addCircleOverlay(cellDiv);
                  correctSound.play();
                  correctCount++;
                } else {
                  cellDiv.style.backgroundColor = "#f88";
                  const correctCell = answerGridEl.querySelector('.grid-cell:not(.countdown)[data-correct="true"]');
                  if(correctCell) {
                    correctCell.style.backgroundColor = "#8f8";
                    addCircleOverlay(correctCell);
                  }
                  incorrectSound.play();
                }
                setTimeout(() => {
                  applyTransition(nextQuestion);
                }, 1000);
              });
            }
            answerGridEl.appendChild(cellDiv);
          }
        }
        
        // タイマー開始
        function startTimer(){
          const cdCell = answerGridEl.querySelector(".grid-cell.countdown");
          const timeDisplay = cdCell.querySelector(".time-display");
          updateCellProgress(cdCell, 100);
          timer = setInterval(() => {
            timeLeft -= 0.1;
            if(timeLeft <= 0){
              timeLeft = 0;
              timeDisplay.textContent = timeLeft.toFixed(1);
              clearInterval(timer);
              // タイムオーバー時、不正解の音を再生
              incorrectSound.play();
              disableGridCells();
              totalElapsed += timeLimit;
              const correctCell = answerGridEl.querySelector('.grid-cell:not(.countdown)[data-correct="true"]');
              if(correctCell) {
                correctCell.style.backgroundColor = "#8f8";
                addCircleOverlay(correctCell);
              }
              setTimeout(() => {
                applyTransition(nextQuestion);
              }, 1000);
            } else {
              timeDisplay.textContent = timeLeft.toFixed(1);
              const pct = (timeLeft / timeLimit) * 100;
              updateCellProgress(cdCell, pct);
            }
          }, 100);
        }
        
        // 進捗更新（背景グラデーション）
        function updateCellProgress(cell, percent){
          cell.style.background = `linear-gradient(to right, #76c7c0 ${percent}%, transparent 0%)`;
        }
        
        // 全セルを無効化
        function disableGridCells(){
          const cells = answerGridEl.querySelectorAll(".grid-cell");
          cells.forEach(cell => cell.classList.add("disabled"));
        }
        
        // トランジション処理（2秒）
        function applyTransition(callback){
          const overlay = document.getElementById("transitionOverlay");
          overlay.style.backgroundColor = randomColor();
          overlay.style.transition = "opacity 1s";
          overlay.style.opacity = "1";
          setTimeout(() => {
            callback();
            overlay.style.transition = "opacity 1s";
            overlay.style.opacity = "0";
          }, 1000);
        }
        
        // ランダムなカラー
        function randomColor(){
          const colors = ["#ff6f61", "#76c7c0", "#f1c40f", "#e74c3c", "#9b59b6"];
          return colors[Math.floor(Math.random() * colors.length)];
        }
        
        // クイズ終了時の処理
        function finishQuiz(){
          quizAppEl.style.display = "none";
          resultMsgEl.innerHTML = `正解数: ${correctCount} / 8<br>かかった時間: ${totalElapsed.toFixed(1)}秒`;
          resultAreaEl.style.display = "block";
          console.log("クイズ終了。結果:", resultMsgEl.innerHTML);
        }
        
        // シャッフル関数
        function shuffleArray(arr){
          let array = arr.slice();
          for(let i = array.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;
        }
      } // end of startQuiz
      
    })();
  </script>
</body>
</html>
