<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>問題管理【問題集別】</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <!-- 必要に応じて base タグを利用する方法もありますが、ここでは adjustPath() 関数で個別に対応 -->
  <style>
    /* 全体レイアウト */
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .quiz-info {
      text-align: center;
      margin-bottom: 20px;
    }
    .quiz-info img {
      width: 60px;
      height: 60px;
      border-radius: 4px;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .quiz-info h2 {
      margin: 5px 0;
    }
    .quiz-info p {
      font-size: 0.9em;
      color: #555;
    }
    /* 問題追加フォーム */
    form {
      margin-bottom: 20px;
    }
    form label {
      display: inline-block;
      width: 120px;
      font-weight: bold;
      vertical-align: top;
      margin-top: 8px;
    }
    form input[type="text"],
    form input[type="file"],
    form textarea {
      width: calc(100% - 130px);
      padding: 8px;
      font-size: 1em;
      margin-bottom: 10px;
    }
    form button {
      padding: 8px 16px;
      font-size: 1em;
      background: #0073e6;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    /* 問題一覧テーブル */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table th, table td {
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 0.9em;
      text-align: left;
      vertical-align: top;
    }
    table th {
      background: #f0f0f0;
    }
    /* テーブル内の画像は小さく表示 */
    table td img {
      max-width: 80px;
      max-height: 80px;
      display: block;
      margin-top: 4px;
    }
    .action-buttons button {
      padding: 4px 8px;
      font-size: 0.9em;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .action-buttons button.delete {
      background: #dc3545;
      color: #fff;
    }
    .nav-buttons {
      text-align: center;
      margin-top: 20px;
    }
    .nav-buttons button {
      padding: 8px 16px;
      font-size: 1em;
      margin: 0 10px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #0073e6;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- クイズセット情報 -->
    <div class="quiz-info" id="quizInfo">
      <!-- プレースホルダー画像はルート直下の img フォルダから参照 -->
      <img id="quizIcon" src="../img/no_image.png" alt="セットアイコン">
      <h2 id="quizName">問題集名</h2>
      <p>ID: <span id="quizId"></span></p>
    </div>
    
    <!-- 問題追加フォーム -->
    <div>
      <h3>新規問題追加</h3>
      <!-- action属性は adminフォルダ内の PHP ファイルを参照 -->
      <form id="problemForm" enctype="multipart/form-data" method="post" action="addProblem.php">
        <!-- hidden: 問題集ID -->
        <input type="hidden" name="setId" id="setId">
        <label>問題文:</label>
        <input type="text" name="question">
        <br>
        <label>問題画像:</label>
        <input type="file" name="questionImage" accept="image/*">
        <br>
        <label>解答1（正解）:</label>
        <input type="text" name="answer1Text">
        <br>
        <label>解答1画像:</label>
        <input type="file" name="answer1Image" accept="image/*">
        <br>
        <label>解答2:</label>
        <input type="text" name="answer2Text">
        <br>
        <label>解答2画像:</label>
        <input type="file" name="answer2Image" accept="image/*">
        <br>
        <label>解答3:</label>
        <input type="text" name="answer3Text">
        <br>
        <label>解答3画像:</label>
        <input type="file" name="answer3Image" accept="image/*">
        <br>
        <button type="submit">問題を追加</button>
      </form>
    </div>
    
    <!-- 登録済み問題一覧 -->
    <div>
      <h3>登録済み問題一覧</h3>
      <table id="problemTable">
        <thead>
          <tr>
            <th>問題文</th>
            <th>解答1</th>
            <th>解答2</th>
            <th>解答3</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <!-- 各問題は1行ずつ表示 -->
        </tbody>
      </table>
    </div>
    
    <!-- ナビゲーション -->
    <div class="nav-buttons">
      <!-- 戻るボタンは管理画面メイン（admin/index.html）へ遷移 -->
      <button id="backToAdminBtn">問題集管理画面へ戻る</button>
    </div>
  </div>
  
  <script>
    // adjustPath() 関数：パスが "img/" で始まる場合、管理画面内では "../" を付加してルート直下のフォルダを参照する
    function adjustPath(path) {
      if (!path) return "";
      if (path.startsWith("http://") || path.startsWith("https://") || path.startsWith("/")) {
        return path;
      }
      // ここでは path が "img/…" などの場合、管理画面は admin フォルダ内にあるので "../" を追加
      return "../" + path;
    }

    document.addEventListener("DOMContentLoaded", function(){
      const params = new URLSearchParams(window.location.search);
      const setId = params.get("setId");
      if(!setId){
        alert("問題集IDが指定されていません。");
        window.location.href = "index.html"; // 管理画面メインへ戻る
        return;
      }
      
      // DOM要素の取得
      const quizIconEl = document.getElementById("quizIcon");
      const quizNameEl = document.getElementById("quizName");
      const quizIdEl = document.getElementById("quizId");
      const setIdInput = document.getElementById("setId");
      const problemForm = document.getElementById("problemForm");
      const problemTableBody = document.getElementById("problemTable").querySelector("tbody");
      const backToAdminBtn = document.getElementById("backToAdminBtn");
      
      setIdInput.value = setId;
      quizIdEl.textContent = setId;
      
      // クイズセット情報の取得（ルート直下のdbフォルダへアクセス）
      fetch("../db/quizSets.json")
        .then(response => {
          if(!response.ok) throw new Error("HTTP error " + response.status);
          return response.json();
        })
        .then(data => {
          const setInfo = data.find(item => item.id === setId);
          if(setInfo){
            quizNameEl.textContent = setInfo.name;
            // setInfo.icon が "img/～" となっている場合、adjustPath() で "../img/～" に変換
            quizIconEl.src = setInfo.icon ? adjustPath(setInfo.icon) : "../img/no_image.png";
          } else {
            alert("指定された問題集情報が見つかりません。");
            window.location.href = "index.html";
          }
        })
        .catch(err => {
          console.error(err);
          alert("問題集情報の読み込みに失敗しました。");
        });
      
      // 問題追加フォーム送信
      problemForm.addEventListener("submit", function(e){
        e.preventDefault();
        const fd = new FormData(problemForm);
        fetch("addProblem.php", { method: "POST", body: fd })
          .then(response => response.json())
          .then(data => {
            if(data.success){
              alert("問題が追加されました。");
              problemForm.reset();
              setIdInput.value = setId;
              loadProblemList(); // 追加後に一覧を更新
            } else {
              alert("問題追加エラー: " + data.error);
            }
          })
          .catch(err => {
            console.error(err);
            alert("問題追加中にエラーが発生しました。");
          });
      });
      
      // 登録済み問題一覧の読み込み（キャッシュ対策としてタイムスタンプを付与）
      function loadProblemList(){
        const url = "../db/" + setId + ".json?t=" + new Date().getTime();
        fetch(url)
          .then(response => response.json())
          .then(data => {
            problemTableBody.innerHTML = "";
            if(!Array.isArray(data) || data.length === 0){
              problemTableBody.innerHTML = "<tr><td colspan='5'>まだ問題が登録されていません。</td></tr>";
              return;
            }
            data.forEach((problem, index) => {
              const tr = document.createElement("tr");
              
              // 問題文（テキストと画像の両方を表示）
              const tdQuestion = document.createElement("td");
              tdQuestion.innerHTML = getQuestionDisplay(problem);
              tr.appendChild(tdQuestion);
              
              // 解答1
              const tdAns1 = document.createElement("td");
              tdAns1.innerHTML = getAnswerDisplay(problem.answers[0]);
              tr.appendChild(tdAns1);
              
              // 解答2
              const tdAns2 = document.createElement("td");
              tdAns2.innerHTML = getAnswerDisplay(problem.answers[1]);
              tr.appendChild(tdAns2);
              
              // 解答3
              const tdAns3 = document.createElement("td");
              tdAns3.innerHTML = getAnswerDisplay(problem.answers[2]);
              tr.appendChild(tdAns3);
              
              // 操作（削除のみ）
              const tdOps = document.createElement("td");
              const delBtn = document.createElement("button");
              delBtn.textContent = "削除";
              delBtn.className = "delete-btn";
              delBtn.addEventListener("click", function(){
                if(confirm("この問題を削除してよろしいですか？")){
                  const fd2 = new FormData();
                  fd2.append("setId", setId);
                  fd2.append("problemIndex", index);
                  fetch("deleteProblem.php", { method: "POST", body: fd2 })
                    .then(response => response.json())
                    .then(resp => {
                      if(resp.success){
                        alert("問題が削除されました。");
                        loadProblemList();
                      } else {
                        alert("削除エラー: " + resp.error);
                      }
                    })
                    .catch(err => {
                      console.error(err);
                      alert("削除中にエラーが発生しました。");
                    });
                }
              });
              tdOps.appendChild(delBtn);
              tr.appendChild(tdOps);
              
              problemTableBody.appendChild(tr);
            });
          })
          .catch(err => {
            console.error(err);
            problemTableBody.innerHTML = "<tr><td colspan='5'>問題一覧の読み込みに失敗しました。</td></tr>";
          });
      }
      
      // 問題表示用関数（テキストと画像の両方を表示）
      function getQuestionDisplay(problem){
        let display = "";
        if(problem.question && problem.question.trim() !== ""){
          display += problem.question;
        }
        if(problem.questionImage && problem.questionImage.trim() !== ""){
          if(display !== "") display += "<br>";
          // 画像パスも adjustPath() で調整
          display += "<img src='" + adjustPath(problem.questionImage) + "' alt='問題画像'>";
        }
        if(display === ""){
          return "(内容なし)";
        }
        return display;
      }
      
      // 解答表示用関数
      function getAnswerDisplay(ans) {
        let display = "";
        if(ans) {
          if(ans.text && ans.text.trim() !== "") {
            display += ans.text;
          }
          if(ans.image && ans.image.trim() !== ""){
            display += "<br><img src='" + adjustPath(ans.image) + "' alt='解答画像'>";
          }
        }
        return display;
      }
      
      loadProblemList();
      
      // ナビゲーション：戻るボタン → 管理用メイン画面（admin/index.html）へ戻る
      backToAdminBtn.addEventListener("click", () => {
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
