<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ向け viewport 指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>まなびーた</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 10px;
      margin: 0;
      background: #f9f9f9;
    }
    h1 {
      font-size: 1.8em;
      margin: 10px 0;
    }
    /* 説明文は1文（改行あり） */
    p.description {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    /* コンテナは CSS Grid を利用し、最大3列に並ぶ */
    .container {
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: center;
      gap: 10px;
    }
    .icon {
      width: 80px;
      height: 80px;
      border: 1px solid #ccc;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
      padding: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .icon img {
      max-width: 60px;
      max-height: 60px;
    }
    .icon span {
      margin-top: 3px;
      font-size: 0.8em;
      color: #333;
    }
    a {
      display: inline-block;
      margin: 15px 0;
      color: #0073e6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>まなびーた</h1>
  <p class="description">5秒で答える全8問！<br>好きな問題に挑戦しよう！</p>
  <div class="container" id="quizSets">
    <!-- quizSets.json の内容を表示 -->
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function(){
      // db/quizSets.json に登録されている問題集情報を読み込み表示
      fetch("db/quizSets.json")
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById("quizSets");
          if(data.length === 0){
            container.innerHTML = "<p>登録された問題集はありません。</p>";
          } else {
            data.forEach(function(set){
              const div = document.createElement("div");
              div.className = "icon";
              div.dataset.setId = set.id;
              const img = document.createElement("img");
              img.src = set.icon ? set.icon : "img/no_image.png"; // アイコン画像（なければプレースホルダー）
              div.appendChild(img);
              const span = document.createElement("span");
              span.textContent = set.name;
              div.appendChild(span);
              div.addEventListener("click", function(){
                window.location.href = "quiz.html?setId=" + encodeURIComponent(set.id);
              });
              container.appendChild(div);
            });
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById("quizSets").innerHTML = "<p>問題集データの読み込みに失敗しました。</p>";
        });
    });
  </script>
</body>
</html>
