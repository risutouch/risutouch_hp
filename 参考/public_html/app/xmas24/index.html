<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- ビューポート設定を更新 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>りすたっちのクリスマスケーキカメラ2024</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Font Awesomeの読み込み -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <!-- タイトルをカメラ映像の上部に表示 -->
  <div id="camera-title">りすたっち！クリスマスケーキ特典！</div>

  <div id="camera-container">
    <!-- カメラ映像 -->
    <video id="camera" autoplay playsinline></video>
    <!-- フレーム描画用Canvas -->
    <canvas id="frame-canvas"></canvas>
  </div>

  <!-- コントロールエリア -->
  <div id="controls">
    <!-- フレーム切替ボタン -->
    <div class="control-button">
      <button id="prev-frame" class="icon-button">
        <i class="fas fa-arrow-left"></i>
      </button>
      <span class="button-label">前</span>
    </div>
    <div class="control-button">
      <button id="next-frame" class="icon-button">
        <i class="fas fa-arrow-right"></i>
      </button>
      <span class="button-label">次</span>
    </div>
    <!-- シャッターボタン -->
    <div class="control-button">
      <div id="shutter-button"></div>
      <span class="button-label">撮影</span>
    </div>
    <!-- カメラ切替ボタン -->
    <div class="control-button">
      <button id="switch-camera" class="icon-button">
        <i class="fas fa-sync-alt"></i>
      </button>
      <span class="button-label">切替</span>
    </div>
    <!-- BGM再生/停止ボタン -->
    <div class="control-button">
      <button id="bgm-toggle" class="icon-button">
        <i class="fas fa-music"></i>
      </button>
      <span class="button-label">BGM</span>
    </div>
  </div>

  <!-- プレビュー画面 -->
  <div id="preview-container">
    <canvas id="preview"></canvas>
    <div id="preview-controls">
      <div class="control-button">
        <button id="cancel" class="icon-button preview-icon">
          <i class="fas fa-arrow-left"></i>
        </button>
        <span class="button-label">戻る</span>
      </div>
      <div class="control-button">
        <button id="download" class="icon-button preview-icon">
          <i class="fas fa-download"></i>
        </button>
        <span class="button-label">保存</span>
      </div>
      <div class="control-button">
        <button id="share" class="icon-button preview-icon">
          <i class="fas fa-paper-plane"></i>
        </button>
        <span class="button-label">シェア</span>
      </div>
    </div>
  </div>

  <!-- シャッター音 -->
  <audio id="shutter-sound1" src="shutter1.mp3" preload="auto"></audio>
  <audio id="shutter-sound2" src="shutter2.mp3" preload="auto"></audio>
  <audio id="shutter-sound3" src="shutter3.mp3" preload="auto"></audio>
  <audio id="shutter-sound4" src="shutter4.mp3" preload="auto"></audio>
  <audio id="shutter-sound5" src="shutter5.mp3" preload="auto"></audio>
  <!-- BGM音声 -->
  <audio id="bgm" src="bgm.mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
