<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="楽しい脱出ゲームに挑戦しよう！シンプルで奥深い謎解きをお楽しみください。">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Happy New Year 2025</title>

  <!-- スマホでピンチズームを無効化＆拡大を抑制 -->
  <meta name="viewport" 
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- タイトル画面 -->
    <div id="title-screen" class="fullscreen">
        <img src="assets/title.gif" alt="Game Title" id="title-image" />
    </div>

    <div id="game-container" class="hidden"> <!-- ゲーム画面を初期非表示に -->
        <canvas id="game-canvas"></canvas>
        <div id="swipe-area"></div>
    </div>

    <!-- メッセージボックス -->
    <div id="message-box" class="hidden">
        <p id="message-text"></p>
    </div>

    <!-- 暗証番号入力モーダル -->
    <div id="code-input-modal" class="modal hidden">
        <div class="modal-content">
            <h2>4桁の暗証番号を入力</h2>
            <input type="password" id="code-input" maxlength="4" />
            <button id="submit-code">送信</button>
            <button id="cancel-code">キャンセル</button>
        </div>
    </div>

    <!-- TVオーバーレイ -->
    <div id="tv-overlay" class="overlay hidden">
        <img src="assets/tv.gif" alt="TV Animation">
    </div>

    <!-- Boardオーバーレイ -->
    <div id="board-overlay" class="overlay hidden">
        <img src="" alt="Board">
    </div>
    
    <!-- Confirm Modal -->
    <div id="confirm-modal" class="confirm-modal hidden">
        <div class="confirm-modal-content">
            <p id="confirm-text">「DJ kj」について調べますか？</p>
            <div class="confirm-modal-buttons">
                <button id="confirm-yes">はい</button>
                <button id="confirm-no">いいえ</button>
            </div>
        </div>
    </div>

    <!-- エンドロール（restartボタンを消す） -->
    <div id="endroll" class="endroll hidden">
        <div id="endroll-text">
            <p>開発 takeko<br>協力 marcy,pino,kj</p>
            <p>Thank you for playing！</p>
            <p>かわいいイラストの年賀状<br>ありがとうございました！<br>今年もよろしくお願いいたします！</p>
            <div style="text-align: center;"><img src="risutouch.png"></div>
        </div>
    </div>

    <!-- ↑ ここから restartボタンは削除しました -->

    <script src="game.js"></script>
</body>
</html>
