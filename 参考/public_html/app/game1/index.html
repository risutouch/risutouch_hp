<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D サイコロ (真上カメラ・壁薄く)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: sans-serif;
    }
    canvas {
      display: block;
    }
    /* UIボタン全体共通 */
    .ui-button {
      cursor: pointer;
      font-size: 16px;
      border: none;
      outline: none;
      padding: 10px 15px;
      margin: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    /* 左下に配置するボタン (1つだけ, 2つだけ, 3つとも) */
    #dice-count-buttons {
      position: absolute;
      left: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      z-index: 10; /* Canvasより前面に */
    }
    /* 右下に配置する「ください」ボタン（丸ボタン） */
    #roll-button {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #ff6666;
      color: #ffffff;
      font-weight: bold;
      text-align: center;
      line-height: 40px; /* 縦のセンタリング用 */
      z-index: 10; /* Canvasより前面に */
    }
    /* ボタンが無効(disabled)のときの見た目 */
    #roll-button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<!-- サイコロ個数切り替えボタン -->
<div id="dice-count-buttons">
  <button id="btn1" class="ui-button">1つだけ</button>
  <button id="btn2" class="ui-button">2つだけ</button>
  <button id="btn3" class="ui-button">3つとも</button>
</div>

<!-- くださいボタン（丸ボタン） -->
<button id="roll-button" class="ui-button">ください</button>

<script type="module">
  // ========== Three.js & Cannon.js の読み込み ==========
  import * as THREE from 'https://esm.sh/three@0.154.0';
  import { RoundedBoxGeometry } from 'https://esm.sh/three@0.154.0/examples/jsm/geometries/RoundedBoxGeometry.js';
  import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/+esm';

  // ========== 定数 (サイコロ衝撃) ==========
  const IMPULSE_STRENGTH_HORIZONTAL = 7;  // 水平衝撃
  const IMPULSE_STRENGTH_VERTICAL   = 7;  // 垂直衝撃
  const IMPULSE_STRENGTH_ROTATION   = 30; // 回転トルク

  // ========== シーン / カメラ / レンダラー ==========
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  // カメラを高さ5で真上に
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 5, 0);
  camera.lookAt(0, 0, 0);

  // レンダラー生成 + 影を有効化
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true; // シャドウ有効
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // リサイズ対応
  window.addEventListener('resize', onWindowResize);
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // ========== Cannon.js (物理ワールド) ==========
  const world = new CANNON.World();
  world.gravity.set(0, -9.82, 0);

  // 摩擦を減らす(0.05) / 弾性0.1
  const defaultMaterial = new CANNON.Material("defaultMaterial");
  world.defaultContactMaterial = new CANNON.ContactMaterial(
    defaultMaterial,
    defaultMaterial,
    {
      friction: 0.05,   // 壁に引っかかりにくく
      restitution: 0.1  // 弾性
    }
  );

  // 床の作成
  const floorBody = new CANNON.Body({
    mass: 0,
    shape: new CANNON.Plane(),
    material: new CANNON.Material("floorMaterial"),
    position: new CANNON.Vec3(0, -1, 0)
  });
  floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(floorBody);

  // Three.js の床メッシュ (PlaneGeometry: 幅4, 奥行8)
  const textureLoader = new THREE.TextureLoader();
  const floorTex = textureLoader.load("img/floor_texture.png");
  floorTex.wrapS = THREE.RepeatWrapping;
  floorTex.wrapT = THREE.RepeatWrapping;
  floorTex.repeat.set(2, 4);

  const floorGeo = new THREE.PlaneGeometry(4, 8);
  const floorMat = new THREE.MeshStandardMaterial({
    map: floorTex,
    side: THREE.DoubleSide
  });
  const floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.position.set(0, -0.8, 0);
  floorMesh.rotation.x = -Math.PI / 2;
  // 影を受け取る設定
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);

  // ========== 壁 (薄く、高さ5) ==========
  const wallThickness = 0.05; // 薄く
  const wallHeight = 5;
  const halfWallHeight = wallHeight / 2;
  // フィールドを縦長にして、左右x=±2、奥・手前z=±4 に壁を配置
  const wallMaterial = new CANNON.Material("wallMaterial");

  // 壁4面の配置情報
  const walls = [
    // 手前（z = -4）
    { x: 0, z: -4, rotateY: 0, w: 2 },
    // 奥（z = 4）
    { x: 0, z:  4, rotateY: 0, w: 2 },
    // 左（x = -2）
    { x: -2, z: 0, rotateY: Math.PI / 2, w: 4 },
    // 右（x =  2）
    { x:  2, z: 0, rotateY: Math.PI / 2, w: 4 }
  ];

  walls.forEach((pos) => {
    // Cannon.js 側の壁
    const wallBody = new CANNON.Body({
      mass: 0,
      shape: new CANNON.Box(
        new CANNON.Vec3(pos.w, halfWallHeight, wallThickness)
      ),
      material: wallMaterial,
      position: new CANNON.Vec3(pos.x, halfWallHeight - 1, pos.z)
    });
    wallBody.quaternion.setFromEuler(0, pos.rotateY, 0);
    world.addBody(wallBody);

    // Three.js 側の壁メッシュ (透明)
    const wallGeo = new THREE.BoxGeometry(pos.w * 2, wallHeight, wallThickness * 2);
    const wallMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
    const wallMesh = new THREE.Mesh(wallGeo, wallMat);
    wallMesh.position.set(pos.x, (wallHeight / 2) - 1, pos.z);
    wallMesh.rotation.y = pos.rotateY;
    scene.add(wallMesh);
  });

  // ========== サイコロ作成用 ==========
  let diceBodies = [];
  let diceMeshes = [];

  // サイコロのジオメトリ＆テクスチャを使い回す
  const diceGeo = new RoundedBoxGeometry(1, 1, 1, 0.3, 6);
  const diceTextures = [
    "img/dice1.png",
    "img/dice2.png",
    "img/dice3.png",
    "img/dice4.png",
    "img/dice5.png",
    "img/dice6.png"
  ].map(path => textureLoader.load(path));
  const diceMatArray = diceTextures.map(tex => {
    return new THREE.MeshStandardMaterial({ map: tex });
  });

  // サイコロ1個を作って返すヘルパー
  function createDice() {
    // Cannon: 物理ボディ
    const body = new CANNON.Body({
      mass: 1,
      shape: new CANNON.Box(new CANNON.Vec3(0.47, 0.47, 0.47)), // 角丸考慮
      material: new CANNON.Material("diceMaterial"),
      // 転がりやすくするためダンピングを小さめ
      linearDamping: 0.01,
      angularDamping: 0.01,
      position: new CANNON.Vec3(0, 2, 0)
    });
    world.addBody(body);

    // Three: メッシュ
    const mesh = new THREE.Mesh(diceGeo, diceMatArray);
    mesh.userData.isDice = true;
    // 影を落とす設定
    mesh.castShadow = true;
    scene.add(mesh);

    return { body, mesh };
  }

  // 既存のサイコロをすべて削除
  function removeAllDice() {
    diceBodies.forEach(dice => {
      world.removeBody(dice);
    });
    diceMeshes.forEach(mesh => {
      scene.remove(mesh);
    });
    diceBodies = [];
    diceMeshes = [];
  }

  // n個のサイコロを用意
  function setDiceCount(n) {
    removeAllDice();
    for (let i = 0; i < n; i++) {
      const dice = createDice();
      diceBodies.push(dice.body);
      diceMeshes.push(dice.mesh);
      // ちょっと左右や前後に散らして配置
      dice.body.position.set(
        (Math.random() - 0.5) * 1.0,  // x
        2 + i * 0.5,                 // y
        (Math.random() - 0.5) * 1.0  // z
      );
    }
  }

  // ========== サイコロを振る関数 ==========
  function rollDice(body) {
    // 水平衝撃
    const fx = (Math.random() - 0.5) * IMPULSE_STRENGTH_HORIZONTAL;
    const fz = (Math.random() - 0.5) * IMPULSE_STRENGTH_HORIZONTAL;
    // 垂直衝撃
    const fy = IMPULSE_STRENGTH_VERTICAL;

    body.applyImpulse(
      new CANNON.Vec3(fx, fy, fz),
      new CANNON.Vec3(0, 0, 0)
    );

    // 回転トルク
    const tx = (Math.random() - 0.5) * IMPULSE_STRENGTH_ROTATION;
    const ty = (Math.random() - 0.5) * IMPULSE_STRENGTH_ROTATION;
    const tz = (Math.random() - 0.5) * IMPULSE_STRENGTH_ROTATION;
    body.applyTorque(new CANNON.Vec3(tx, ty, tz));
  }

  // フィールドにあるサイコロをすべて振る
  function rollAllDice() {
    for (let i = 0; i < diceBodies.length; i++) {
      rollDice(diceBodies[i]);
    }
  }

  // 全サイコロが停止しているかチェック
  function allDiceStopped() {
    for (let i = 0; i < diceBodies.length; i++) {
      const b = diceBodies[i];
      if (b.velocity.length() > 0.1 || b.angularVelocity.length() > 0.1) {
        return false;
      }
    }
    return true;
  }

  // ========== クリック / タップでサイコロを個別に振る (任意) ==========
  function onPointerDown(event) {
    const rect = renderer.domElement.getBoundingClientRect();
    const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(x, y), camera);

    // 全サイコロに対して当たり判定
    const intersects = raycaster.intersectObjects(diceMeshes);
    if (intersects.length > 0) {
      // 一番手前にあるサイコロを取得
      const hit = intersects[0].object;
      const index = diceMeshes.indexOf(hit);
      if (index >= 0) {
        const body = diceBodies[index];
        // あまり速く動いてなければ振る
        if (
          body.velocity.length() < 0.1 &&
          body.angularVelocity.length() < 0.1
        ) {
          rollDice(body);
        }
      }
    }
  }
  window.addEventListener('pointerdown', onPointerDown);

  // ========== ライト (真上から) ==========
  const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
  directionalLight.position.set(0, 10, 0);
  directionalLight.castShadow = true;  // 影を落とす
  // シャドウの設定 (少し広めに設定して床全体をカバー)
  directionalLight.shadow.mapSize.width = 1024;
  directionalLight.shadow.mapSize.height = 1024;
  // ディレクショナルライトのシャドウカメラ範囲(正射影)を設定
  directionalLight.shadow.camera.near = 0.5;
  directionalLight.shadow.camera.far = 30;
  directionalLight.shadow.camera.left = -5;
  directionalLight.shadow.camera.right = 5;
  directionalLight.shadow.camera.top = 5;
  directionalLight.shadow.camera.bottom = -5;
  // 影のにじみ具合を調整(値を小さくするとシャープになる)
  directionalLight.shadow.radius = 0.5;
  scene.add(directionalLight);

  // アンビエントライト(少し抑え気味にして影をくっきりさせる)
  const ambientLight = new THREE.AmbientLight(0x666666, 0.4);
  scene.add(ambientLight);

  // ========== 初期設定: サイコロ1つだけ ==========
  setDiceCount(1);

  // ========== UIボタンイベント ==========
  const rollButton = document.getElementById('roll-button');
  document.getElementById('btn1').addEventListener('click', () => {
    setDiceCount(1);
  });
  document.getElementById('btn2').addEventListener('click', () => {
    setDiceCount(2);
  });
  document.getElementById('btn3').addEventListener('click', () => {
    setDiceCount(3);
  });
  rollButton.addEventListener('click', () => {
    // ボタンが押された瞬間に全サイコロを振る
    // （ただし実際には "全停止"でなければ disabled なので押せない）
    rollAllDice();
  });

  // ========== アニメーションループ ==========
  function animate() {
    requestAnimationFrame(animate);

    // 物理世界のステップ
    world.step(1 / 60);

    // 物理 → Three.js メッシュ反映
    for (let i = 0; i < diceBodies.length; i++) {
      diceMeshes[i].position.copy(diceBodies[i].position);
      diceMeshes[i].quaternion.copy(diceBodies[i].quaternion);
    }

    // 「くださいボタン」はサイコロが全部止まっていなければ無効にする
    rollButton.disabled = !allDiceStopped();

    renderer.render(scene, camera);
  }
  animate();

</script>
</body>
</html>
